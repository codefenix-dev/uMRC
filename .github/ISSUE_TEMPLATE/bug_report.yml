name: 🪲 Bug Report
description: Report a bug or unexpected behavior in uMRC
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > # 🛑 Read this first
        > Before submitting an issue, please confirm the checks below.

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I am running the [latest version of uMRC](https://github.com/codefenix-dev/uMRC/releases).
          required: true
        - label: I checked the included readme and help files (e.g., `/help`).
          required: true
        - label: I checked the [changelog](https://github.com/codefenix-dev/uMRC/blob/main/changelog.txt) to ensure this was not already addressed.
          required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: To Reproduce
      description: Steps to reproduce the behavior.
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - Linux
        - macOS
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: uMRC Version
      description: Which version of uMRC are you running?
      placeholder: e.g. 1.0.8
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots & Additional Context
      description: Drag and drop screenshots here, or add any other context about the problem.
